<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Be+Vietnam+Pro:wght@600&amp;display=swap');
      .iso { font-family: 'Space Grotesk', monospace; font-weight: 700; font-size: 17.5px; fill: #8F2825; letter-spacing: 0.08em; filter: url(#softShadow); }
      .sub { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 13.5px; fill: #B83B37; }
