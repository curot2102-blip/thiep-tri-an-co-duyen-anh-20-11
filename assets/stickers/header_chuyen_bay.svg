<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&amp;family=Playfair+Display:wght@800;900&amp;display=swap');
      .title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 33px; fill: #2E453F; letter-spacing: 0.05em; filter: url(#softShadow); }
      .sub { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 700; font-size: 13.5px; fill: #5B706A; letter-spacing: 0.15em; filter: url(#softShadow); }
    </style>
  </defs>
  <text x="160" y="36" text-anchor="middle" class="title">CHUYẾN BAY</text>
  <text x="160" y="70" text-anchor="middle" class="title">THANH XUÂN</text>
  <line x1="70" y1="80" x2="250" y2="80" stroke="#5B706A" stroke-width="1.2" opacity="0.5" />
  <text x="160" y="98" text-anchor="middle" class="sub">HÀNH TRÌNH TUỔI TRẺ</text>
</svg>