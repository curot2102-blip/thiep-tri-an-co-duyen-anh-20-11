<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600&amp;family=Playfair+Display:ital,wght@1,800&amp;display=swap');
      .quote { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; font-size: 26px; fill: #164293; filter: url(#softShadow); }
      .sub { font-family: 'Be Vietnam Pro', sans-serif; font-weight: 600; font-size: 13px; fill: #5A6C8F; letter-spacing: 0.14em; }
    </style>
  </defs>
  <text x="160" y="38" text-anchor="middle" class="quote">“ Một chữ cũng là thầy ”</text>
  <line x1="60" y1="51" x2="260" y2="51" stroke="#164293" stroke-width="1.2" opacity="0.4"/>
  <text x="160" y="70" text-anchor="middle" class="sub">— NGÀY NHÀ GIÁO VIỆT NAM 20.11 —</text>
