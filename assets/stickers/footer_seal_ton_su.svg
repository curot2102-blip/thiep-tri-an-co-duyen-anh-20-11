<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500&amp;family=Playfair+Display:ital,wght@1,700&amp;display=swap');
      .calli {{ font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 19px; fill: #1B3540; }}
      .sub {{ font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500; font-size: 11px; fill: #4B6B78; }}
      .seal-text {{ font-family: 'Playfair Display', serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.1em; }}
    </style>
  </defs>
  <text x="24" y="36" class="calli">Ơn Thầy Nghĩa Cô</text>
  <text x="24" y="58" class="sub">Kỷ niệm ngày 20 • 11</text>
  <!-- Red seal stamp -->
  <g transform="translate(195, 14)">
    <rect x="0" y="0" width="62" height="52" rx="10" fill="#B91C1C" stroke="#991B1B" stroke-width="1.5"/>
    <rect x="3" y="3" width="56" height="46" rx="8" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <text x="31" y="32" text-anchor="middle" class="seal-text">TÔN SƯ</text>
  </g>
</svg>